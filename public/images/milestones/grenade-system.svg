<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 235" role="img" aria-labelledby="gr-title gr-desc">
  <title id="gr-title">Grenade machine architecture and SELinux pivot</title>
  <desc id="gr-desc">AlmaLinux machine running WordPress GiveWP inside confined httpd_t SELinux context, pivoting via backup credentials to SSH and escalating via kernel dirtyfrag exploit.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#191919" />
    </marker>
    <style>
      .ink { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191919; }
      .dim { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #595959; }
      .mono { font: 500 11px ui-monospace, Menlo, Consolas, monospace; fill: #191919; }
      .card { fill: #f9f9f9; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .soft { fill: #f1f1f1; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .bound { fill: none; stroke: #b0b0b0; stroke-width: 1.3; stroke-dasharray: 4 4; rx: 6; }
      .line { stroke: #191919; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <!-- SELinux boundary -->
  <rect class="bound" x="12" y="18" width="352" height="148" />
  <text class="dim" x="24" y="38">SELinux confined context (httpd_t)</text>

  <rect class="card" x="26" y="52" width="150" height="96" />
  <text class="ink" x="40" y="76">Apache (8080)</text>
  <text class="dim" x="40" y="96">WordPress 6.6.2</text>
  <text class="dim" x="40" y="114">GiveWP plugin</text>
  <text class="dim" x="40" y="132">object injection</text>

  <path class="line" d="M 176 100 L 204 100" />

  <rect class="card" x="208" y="52" width="142" height="96" />
  <text class="ink" x="222" y="76">Web Shell</text>
  <text class="mono" x="222" y="98">www-data</text>
  <text class="dim" x="222" y="118">Finds encoded</text>
  <text class="dim" x="222" y="134">backup file</text>

  <!-- Pivot out of SELinux via SSH (wide 82px gap for clean label) -->
  <path class="line" d="M 350 100 L 428 100" />
  <text class="dim" x="392" y="88" text-anchor="middle">SSH (22)</text>

  <rect class="card" x="432" y="52" width="148" height="96" />
  <text class="ink" x="446" y="76">User Shell</text>
  <text class="mono" x="446" y="98">give</text>
  <text class="dim" x="446" y="118">Unconfined shell</text>
  <text class="dim" x="446" y="134">on AlmaLinux</text>

  <path class="line" d="M 580 100 L 608 100" />

  <rect class="soft" x="612" y="52" width="136" height="96" />
  <text class="ink" x="626" y="76">Kernel Escalate</text>
  <text class="dim" x="626" y="98">Linux 6.12.0</text>
  <text class="dim" x="626" y="116">dirtyfrag PoC</text>
  <text class="mono" x="626" y="134">→ root</text>

  <line x1="12" y1="190" x2="748" y2="190" stroke="#e2e2e2" stroke-width="1" />
  <text class="dim" x="12" y="212">Web RCE stays trapped under httpd_t until credential recovery opens an unconfined SSH session.</text>
</svg>
