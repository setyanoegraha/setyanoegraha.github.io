<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="gp-title gp-desc">
  <title id="gp-title">Groups watchdog trigger and raw disk escalation</title>
  <desc id="gp-desc">Catastrophic regex backtracking stalls the single-process Python log server, causing a cron watchdog to open a recovery shell on port 8090 as setup with disk group raw partition access.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#191919" />
    </marker>
    <style>
      .ink { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191919; }
      .dim { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #595959; }
      .mono { font: 500 11px ui-monospace, Menlo, Consolas, monospace; fill: #191919; }
      .card { fill: #f9f9f9; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .soft { fill: #f1f1f1; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .line { stroke: #191919; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
      .dash { stroke: #777777; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <!-- Top: ReDoS stalls Python GIL -->
  <rect class="card" x="12" y="22" width="186" height="84" />
  <text class="ink" x="26" y="46">logiscope (2299)</text>
  <text class="dim" x="26" y="66">Stores custom regex,</text>
  <text class="dim" x="26" y="84">runs on event ingest</text>

  <path class="line" d="M 198 64 L 246 64" />
  <text class="dim" x="204" y="54">ReDoS</text>

  <rect class="soft" x="250" y="22" width="180" height="84" />
  <text class="ink" x="264" y="46">Single-vCPU Freeze</text>
  <text class="dim" x="264" y="66">Python GIL locks up;</text>
  <text class="dim" x="264" y="84">/health probe times out</text>

  <!-- Watchdog reaction -->
  <path class="dash" d="M 340 106 L 340 144" />
  <text class="dim" x="350" y="130">2 missed checks</text>

  <rect class="card" x="210" y="148" width="220" height="84" />
  <text class="ink" x="224" y="172">Cron Watchdog (8090)</text>
  <text class="dim" x="224" y="192">Spawns fail-open recovery</text>
  <text class="mono" x="224" y="210">netcat shell as setup</text>

  <!-- Disk group escalation -->
  <path class="line" d="M 430 190 L 474 190" />

  <rect class="card" x="478" y="148" width="136" height="84" />
  <text class="ink" x="492" y="172">disk Group</text>
  <text class="dim" x="492" y="192">Raw write access</text>
  <text class="mono" x="492" y="210">to /dev/sda3</text>

  <path class="line" d="M 614 190 L 642 190" />

  <rect class="soft" x="646" y="148" width="102" height="84" />
  <text class="ink" x="660" y="172">Root</text>
  <text class="dim" x="660" y="192">Patches doas</text>
  <text class="dim" x="660" y="210">rule on disk</text>
</svg>
