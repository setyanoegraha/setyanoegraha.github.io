<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="ck-title ck-desc">
  <title id="ck-title">CareKicks three-tier system topology</title>
  <desc id="ck-desc">Flutter mobile app and Next.js web portal connect through one central REST API to PostgreSQL storage, FCM push alerts, email verification, and order expiration checks.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#191919" />
    </marker>
    <style>
      .ink { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191919; }
      .dim { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #595959; }
      .card { fill: #f9f9f9; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .soft { fill: #f1f1f1; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .line { stroke: #191919; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <!-- Left clients -->
  <rect class="card" x="12" y="22" width="224" height="106" />
  <text class="ink" x="26" y="48">Mobile App (Flutter)</text>
  <text class="dim" x="26" y="70">Customer: map, cart, proofs</text>
  <text class="dim" x="26" y="88">Shop: QR scan, queues, stock,</text>
  <text class="dim" x="26" y="106">and walk-in order entry</text>

  <rect class="card" x="12" y="144" width="224" height="96" />
  <text class="ink" x="26" y="170">Web Portal (Next.js)</text>
  <text class="dim" x="26" y="192">Superadmin &amp; shop approvals,</text>
  <text class="dim" x="26" y="210">order trends, user moderation</text>

  <path class="line" d="M 236 75 L 274 114" />
  <path class="line" d="M 236 192 L 274 152" />

  <!-- Central API spine -->
  <rect class="soft" x="278" y="42" width="194" height="184" />
  <text class="ink" x="296" y="72">Central REST API</text>
  <text class="dim" x="296" y="96">Role routes: customer,</text>
  <text class="dim" x="296" y="114">shop admin, superadmin</text>
  <line x1="296" y1="132" x2="454" y2="132" stroke="#d8d8d8" stroke-width="1" />
  <text class="dim" x="296" y="154">JWT auth &amp; rate limit</text>
  <text class="dim" x="296" y="172">5 MB photo upload buffer</text>
  <text class="dim" x="296" y="190">Suspended-shop guard</text>
  <text class="dim" x="296" y="208">Unpaid order expiration</text>

  <path class="line" d="M 472 82 L 512 54" />
  <path class="line" d="M 472 134 L 512 134" />
  <path class="line" d="M 472 186 L 512 214" />

  <!-- Right infra -->
  <rect class="card" x="516" y="22" width="232" height="62" />
  <text class="ink" x="532" y="46">Database &amp; Storage</text>
  <text class="dim" x="532" y="66">Orders, queues &amp; photos</text>

  <rect class="card" x="516" y="103" width="232" height="62" />
  <text class="ink" x="532" y="127">Mobile Push Alerts</text>
  <text class="dim" x="532" y="147">Order status updates to app</text>

  <rect class="card" x="516" y="184" width="232" height="62" />
  <text class="ink" x="532" y="208">Email Verification &amp; OTP</text>
  <text class="dim" x="532" y="228">Signup links &amp; password reset</text>
</svg>
