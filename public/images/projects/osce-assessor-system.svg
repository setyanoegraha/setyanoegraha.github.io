<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="osce-title osce-desc">
  <title id="osce-title">OSCE Assessor three-role examination lifecycle</title>
  <desc id="osce-desc">Exam lifecycle across Administrator, Examiner, and Student roles covering station setup, live rotation scoring, and Excel and PDF recapitulation.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#191919" />
    </marker>
    <style>
      .ink { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191919; }
      .dim { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #595959; }
      .card { fill: #f9f9f9; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .soft { fill: #f1f1f1; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .line { stroke: #191919; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
      .rule { stroke: #e2e2e2; stroke-width: 1; }
    </style>
  </defs>

  <text class="dim" x="142" y="20">Before exam</text>
  <text class="dim" x="352" y="20">During stations</text>
  <text class="dim" x="556" y="20">After session</text>

  <!-- Row 1: Administrator -->
  <text class="ink" x="12" y="64">Administrator</text>
  <rect class="soft" x="142" y="34" width="182" height="54" />
  <text class="dim" x="156" y="56">Rooms, stations, rubrics</text>
  <text class="dim" x="156" y="74">&amp; Excel student roster</text>
  <path class="line" d="M 324 61 L 552 61" />
  <rect class="card" x="556" y="34" width="192" height="54" />
  <text class="dim" x="570" y="56">Archive grade recaps</text>
  <text class="dim" x="570" y="74">Excel &amp; PDF exports</text>

  <line class="rule" x1="12" y1="102" x2="748" y2="102" />

  <!-- Row 2: Examiner -->
  <text class="ink" x="12" y="144">Examiner</text>
  <path class="line" d="M 233 88 L 233 140 L 348 140" />
  <rect class="card" x="352" y="114" width="174" height="54" />
  <text class="dim" x="366" y="136">Live rotation queue</text>
  <text class="dim" x="366" y="154">&amp; rubric scoring</text>
  <path class="line" d="M 526 141 L 552 141" />
  <rect class="card" x="556" y="114" width="192" height="54" />
  <text class="dim" x="570" y="136">Review, edit &amp; export</text>
  <text class="dim" x="570" y="154">station PDF sheets</text>

  <line class="rule" x1="12" y1="182" x2="748" y2="182" />

  <!-- Row 3: Student -->
  <text class="ink" x="12" y="222">Student</text>
  <rect class="card" x="142" y="194" width="182" height="50" />
  <text class="dim" x="156" y="216">Check assigned station</text>
  <text class="dim" x="156" y="233">&amp; exam schedule</text>
  <path class="line" d="M 526 156 L 542 156 L 542 219 L 552 219" />
  <rect class="card" x="556" y="194" width="192" height="50" />
  <text class="dim" x="570" y="216">View released grades</text>
  <text class="dim" x="570" y="233">&amp; rubric feedback</text>
</svg>
