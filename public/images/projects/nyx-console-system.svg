<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" role="img" aria-labelledby="nyx-title nyx-desc">
  <title id="nyx-title">Nyx Console catalog and download branch</title>
  <desc id="nyx-desc">Two-track workflow: public machine browsing and local leaderboard calculation on top, and automated CAPTCHA decoding with Proton Drive streaming or browser fallback below.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#191919" />
    </marker>
    <style>
      .ink { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191919; }
      .dim { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #595959; }
      .mono { font: 500 11px ui-monospace, Menlo, Consolas, monospace; fill: #191919; }
      .card { fill: #f9f9f9; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .soft { fill: #f1f1f1; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .line { stroke: #191919; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
      .dash { stroke: #777777; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect class="soft" x="12" y="34" width="136" height="182" />
  <text class="ink" x="28" y="64">VulNyx Site</text>
  <text class="dim" x="28" y="88">No account,</text>
  <text class="dim" x="28" y="106">handle only</text>
  <line x1="28" y1="124" x2="132" y2="124" stroke="#d8d8d8" stroke-width="1" />
  <text class="dim" x="28" y="146">Catalog</text>
  <text class="dim" x="28" y="164">First-blood flags</text>
  <text class="dim" x="28" y="182">Writeups</text>

  <path class="line" d="M 148 70 L 188 70" />
  <rect class="card" x="192" y="28" width="250" height="82" />
  <text class="ink" x="208" y="54">Browse &amp; Submit</text>
  <text class="dim" x="208" y="76">Filter catalog, submit MD5</text>
  <text class="dim" x="208" y="94">flags &amp; community writeups</text>

  <path class="line" d="M 442 69 L 478 69" />
  <rect class="card" x="482" y="28" width="266" height="82" />
  <text class="ink" x="498" y="54">Local Leaderboard</text>
  <text class="dim" x="498" y="76">Computes rank locally with</text>
  <text class="dim" x="498" y="94">official rules &amp; exclusions</text>

  <path class="line" d="M 148 174 L 188 174" />
  <rect class="card" x="192" y="132" width="174" height="84" />
  <text class="ink" x="208" y="158">PNG CAPTCHA</text>
  <text class="dim" x="208" y="180">160x50 bitmap</text>
  <text class="dim" x="208" y="198">glyph matching</text>

  <path class="line" d="M 366 174 L 402 174" />
  <polygon points="436,144 470,174 436,204 402,174" fill="#f9f9f9" stroke="#191919" stroke-width="1.3" />
  <text class="mono" x="418" y="178">match?</text>

  <path class="line" d="M 470 174 L 520 174" />
  <text class="dim" x="480" y="166">yes</text>
  <rect class="card" x="524" y="132" width="224" height="84" />
  <text class="ink" x="540" y="158">Proton Drive Stream</text>
  <text class="dim" x="540" y="180">Share key authentication</text>
  <text class="dim" x="540" y="198">Max 2 parallel transfers</text>

  <path class="dash" d="M 436 204 L 436 240 L 520 240" />
  <text class="dim" x="446" y="234">no</text>
  <text class="dim" x="526" y="244">Open download page in browser</text>
</svg>
