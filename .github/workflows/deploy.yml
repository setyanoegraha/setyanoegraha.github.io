name: scheduled deploy

on:
  schedule:
    - cron: "0 21 * * *" # daily 04:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 (pinned to SHA)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node@v4 (pinned to SHA)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      - name: Build site
        run: npx astro build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages branch
        # peaceiris/actions-gh-pages@v4 (pinned to SHA)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
