<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="cli-title cli-desc">
  <title id="cli-title">HMV CLI subcommand pipeline</title>
  <desc id="cli-desc">Sequential terminal command flow from keyring login and HTML scraping to resolving MEGA download redirects with progress bars.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#191919" />
    </marker>
    <style>
      .ink { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191919; }
      .dim { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #595959; }
      .mono { font: 500 11px ui-monospace, Menlo, Consolas, monospace; fill: #191919; }
      .card { fill: #f9f9f9; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .soft { fill: #f1f1f1; stroke: #cfcfcf; stroke-width: 1.25; rx: 5; }
      .line { stroke: #191919; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect class="soft" x="12" y="24" width="154" height="92" />
  <text class="ink" x="26" y="50">CLI Command</text>
  <text class="mono" x="26" y="72">hmv machine</text>
  <text class="dim" x="26" y="92">list, search, flag,</text>
  <text class="dim" x="26" y="106">writeup, download</text>

  <path class="line" d="M 166 70 L 198 70" />

  <rect class="card" x="202" y="24" width="160" height="92" />
  <text class="ink" x="216" y="50">Session + Parse</text>
  <text class="dim" x="216" y="72">Unlocks OS keyring</text>
  <text class="dim" x="216" y="90">Scrapes catalog &amp;</text>
  <text class="dim" x="216" y="106">syncs Pwned state</text>

  <path class="line" d="M 362 70 L 394 70" />

  <rect class="card" x="398" y="24" width="164" height="92" />
  <text class="ink" x="412" y="50">Redirect Hop</text>
  <text class="dim" x="412" y="72">Follows download</text>
  <text class="dim" x="412" y="90">URL redirect to</text>
  <text class="dim" x="412" y="106">target MEGA link</text>

  <path class="line" d="M 562 70 L 594 70" />

  <rect class="card" x="598" y="24" width="148" height="92" />
  <text class="ink" x="612" y="50">Archive Stream</text>
  <text class="dim" x="612" y="72">Checks collisions</text>
  <text class="dim" x="612" y="90">Pulls zip with live</text>
  <text class="dim" x="612" y="106">progress bar</text>

  <line x1="12" y1="146" x2="746" y2="146" stroke="#e2e2e2" stroke-width="1" />
  <text class="dim" x="12" y="168">Prototype predecessor to HackMyVM Console, later rebuilt into a full-screen Rust dashboard.</text>
</svg>
